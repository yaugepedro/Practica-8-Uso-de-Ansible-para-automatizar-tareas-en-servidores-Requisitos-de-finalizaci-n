# Cada servidor tiene su IP dentro de la red de Docker (ip_docker).
# Desde WSL me conecto por 127.0.0.1 y el puerto de cada contenedor,
# porque las IPs 172.20.0.x normalmente no se alcanzan desde WSL.
[servidores]
server1 ansible_host=127.0.0.1 ansible_port=2221 ip_docker=172.20.0.11
server2 ansible_host=127.0.0.1 ansible_port=2222 ip_docker=172.20.0.12
server3 ansible_host=127.0.0.1 ansible_port=2223 ip_docker=172.20.0.13
server4 ansible_host=127.0.0.1 ansible_port=2224 ip_docker=172.20.0.14
server5 ansible_host=127.0.0.1 ansible_port=2225 ip_docker=172.20.0.15

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
